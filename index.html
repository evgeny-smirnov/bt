<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<button id="connect">Connect to ESP32</button>
<button id="send">Send Data</button>
<input id="ledPower" type="range" min="0" max="255" value="0" />
<pre id="output"></pre>
</body>
<script>
  let device;
  let server;
  let service;
  let txCharacteristic;
  let rxCharacteristic;

  async function connect() {
    try {
      device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: ['d633fc4a-9b43-4f0c-a650-fca79029c70b']
      });
      server = await device.gatt.connect();
      putError('server:', JSON.stringify(server));
      service = await server.getPrimaryService('d633fc4a-9b43-4f0c-a650-fca79029c70b');
      txCharacteristic = await service.getCharacteristic('859ed99c-fa53-40df-9900-f23bacbd257d');
      rxCharacteristic = await service.getCharacteristic('d5e37bdd-d07b-459f-82c6-66f689bc946a');
      putError('Connected to ESP32!');

      txCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
        let value = new TextDecoder().decode(event.target.value);
        putError('Received:', value);
      });
      await txCharacteristic.startNotifications();
    } catch (error) {
      putError('Connection failed', error.toString());
    }
  }

  async function sendData(data) {
    if (!rxCharacteristic) {
      putError('Not connected!');
      return;
    }
    const encoder = new TextEncoder();
    await rxCharacteristic.writeValue(encoder.encode(data));
    putError('Sent:', data);
  }

  document.querySelector('#connect').addEventListener('click', connect);
  document.querySelector('#send').addEventListener('click', () => sendData('Hello from Browser'));
  document.querySelector('#ledPower').addEventListener('change', (e) => {
    const ledPower = parseInt(e.target.value);
    putError('ledPower', ledPower);
    if(!isNaN(ledPower)) {
      sendData('SET_LED '+ledPower);
    }
  })

  function putError(...e) {
    const output = document.querySelector('#output');
    if(!output) {
      return;
    }
    output.innerHTML += JSON.stringify(e, null, 2);
  }

</script>
</html>
